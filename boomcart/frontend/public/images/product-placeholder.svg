<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <!-- Background: Warm Cream -->
  <rect width="400" height="500" fill="#FDF7F0"/>
  
  <!-- Minimalist Hanger Icon: Deep Green -->
  <g stroke="#1E3A3A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(100, 140)">
    <!-- Hook -->
    <path d="M100 30 C100 0, 130 0, 130 30 C130 60, 100 50, 100 80" />
    <!-- Shoulders -->
    <path d="M100 80 L30 140 L170 140 Z" />
  </g>
  
  <!-- Subtle Accent: Terracotta -->
  <circle cx="200" cy="340" r="3" fill="#C25A3C" />
  
  <!-- Brand Text -->
  <text x="200" y="380" font-family="'Cormorant Garamond', serif" font-size="12" fill="#1E3A3A" text-anchor="middle" letter-spacing="6">BOOMCART</text>
</svg>
